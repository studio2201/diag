[workspace]
members = ["common", "backend", "frontend"]
resolver = "2"

[workspace.dependencies]
shared-core = { path = "../shared-assets/shared-rust/shared-core" }
shared-backend = { path = "../shared-assets/shared-rust/shared-backend" }
shared-frontend = { path = "../shared-assets/shared-rust/shared-frontend" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
yew = { version = "0.23", features = ["csr"] }
gloo-net = "0.3"
wasm-bindgen-futures = "0.4"
eframe = "0.27"
egui = "0.27"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "WebGl2RenderingContext", "Window", "Document"] }
